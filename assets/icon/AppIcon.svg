<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232C3F"/>
      <stop offset="1" stop-color="#0A0E16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowOrange"><stop offset="0" stop-color="#FF9F0A" stop-opacity="0.65"/><stop offset="1" stop-color="#FF9F0A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGreen"><stop offset="0" stop-color="#30D158" stop-opacity="0.5"/><stop offset="1" stop-color="#30D158" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- Full bleed: macOS (26+) applies the rounded-square mask, its edge and shadow itself. Artwork that does
       not fill the canvas is shown on a white plate. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#rim)" opacity="0.35"/>

  <!-- Session rows, laid out for an 824pt squircle at (100, 100), scaled to the full canvas. -->
  <g transform="scale(1.242718) translate(-100 -100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- working -->
    <rect x="196" y="260" width="632" height="150" rx="42" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="281" cy="335" r="70" fill="url(#glowBlue)"/>
    <circle cx="281" cy="335" r="30" fill="#0A84FF"/>
    <path d="M362 307 L392 335 L362 363" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="20"/>
    <line x1="436" y1="335" x2="720" y2="335" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="20"/>

    <!-- needs input (highlighted) -->
    <rect x="196" y="437" width="632" height="150" rx="42" fill="#FF9F0A" fill-opacity="0.14" stroke="#FF9F0A" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="281" cy="512" r="80" fill="url(#glowOrange)"/>
    <circle cx="281" cy="512" r="46" fill="none" stroke="#FF9F0A" stroke-opacity="0.45" stroke-width="6"/>
    <circle cx="281" cy="512" r="30" fill="#FF9F0A"/>
    <path d="M362 484 L392 512 L362 540" fill="none" stroke="#FFFFFF" stroke-width="20"/>
    <line x1="436" y1="512" x2="600" y2="512" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="20"/>
    <rect x="636" y="487" width="22" height="50" rx="5" fill="#FFFFFF"/>

    <!-- done -->
    <rect x="196" y="614" width="632" height="150" rx="42" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="281" cy="689" r="70" fill="url(#glowGreen)"/>
    <circle cx="281" cy="689" r="30" fill="#30D158"/>
    <path d="M362 661 L392 689 L362 717" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="20"/>
    <line x1="436" y1="689" x2="660" y2="689" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="20"/>
  </g>
</svg>
